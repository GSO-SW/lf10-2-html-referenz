<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="t">
  <title id="t">Stundenplan-Ausschnitt mit einer markierten Vertretungsstunde</title>
  <rect width="320" height="200" fill="#f2f4f7"/>
  <g fill="#ffffff" stroke="#8a8a8e">
    <rect x="20" y="20" width="60" height="30"/><rect x="90" y="20" width="60" height="30"/>
    <rect x="160" y="20" width="60" height="30"/><rect x="230" y="20" width="60" height="30"/>
    <rect x="20" y="60" width="60" height="30"/><rect x="90" y="60" width="60" height="30"/>
    <rect x="230" y="60" width="60" height="30"/>
    <rect x="20" y="100" width="60" height="30"/><rect x="90" y="100" width="60" height="30"/>
    <rect x="160" y="100" width="60" height="30"/><rect x="230" y="100" width="60" height="30"/>
    <rect x="20" y="140" width="60" height="30"/><rect x="160" y="140" width="60" height="30"/>
    <rect x="230" y="140" width="60" height="30"/>
  </g>
  <rect x="160" y="60" width="60" height="30" fill="#0b5cad"/>
  <text x="190" y="80" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Vertr.</text>
  <rect x="90" y="140" width="60" height="30" fill="#ffffff" stroke="#b00020" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="120" y="160" font-family="sans-serif" font-size="11" fill="#b00020" text-anchor="middle">entfällt</text>
</svg>
